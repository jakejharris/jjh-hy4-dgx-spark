# Hy4 EXL3 trunk quantization recipe: uniform 6-bit (k2=12, mul1, --out_scales always)
# Includes optional 6-bit EXL3 lm_head sidecar (lm_head.safetensors) and 6-bit DFly body (dfly_layers.safetensors).
# Change default_bits / lm_head_bits / dfly_bits in one line (supported: 3, 4, 6, 8; null or 16 = skip/lossless).
profile: trunk-6b
codebook: mul1
out_scales: always
default_bits: 6
lm_head_bits: 6
dfly_bits: 6
dfly_overrides: {}
matrices: {}
overrides:
  model.layers.75.mlp.shared_experts.down_proj: 16
  model.layers.76.mlp.shared_experts.down_proj: 16
